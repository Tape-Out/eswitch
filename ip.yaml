name: eswitch
version: 0.1.0
spec: '0.1'
kind: ip
lang: bsv
identity:
  slug: eswitch-tapeout-bsv
  display_name: Layer 2 Ethernet switch
  summary: Cut through forwarding with a learned address table.
  category: network
  subcategories:
  - ethernet
  - switch
  ip_family: eswitch
  integration_profile:
  - apb4-slave
  maturity: planned
contract:
  version: 1
  ctrl:
    shape: flat
    aw: 12
    dw: 32
params:
  ports:
    type: int
    default: 4
    range:
    - 2
    - 8
    desc: 端口数
  macEntries:
    type: int
    default: 16
    range:
    - 4
    - 64
    desc: 学习表条目数。这是 CAM，触发器加比较器，条目数直接决定面积
features:
  vlan:
    type: bool
    default: false
    area:
      points:
        '2': 614.6
        '3': -390.04
        '4': -988.12
      per: ports
test:
  skip:
  - ports: 8
    macEntries: 64
  - macEntries: 64
  extra:
  - macEntries: 32
  - ports: 8
    macEntries: 8
emit:
- kind: bsv
  package: Eswitch
  module: mkEswitch
  config_type: EswitchCfg
  interface: EswitchIfc
  ctrl: regs
  pins:
  - name: pins
    type: EswitchPins
    targs:
    - ports
- kind: verilog-flat
  bus: apb4
deps:
  hwcore: ^0.1
  amba: ^0.1
  emac: ^0.1
area:
  base:
    points:
      '2': 34497.96
      '3': 43973.44
      '4': 55221.04
    per: ports
  margin: 0.0533
  model: points-additive
  error:
    bound: 0.043
    sign: over
    note: parameter curves stored as measured points, one knob at a time with the
      rest at their defaults, then added; the worst under estimate found so far is
      the cross point macEntries 24 with eight ports and VLAN on, which came in 4.31
      percent under before the lift
  measured:
